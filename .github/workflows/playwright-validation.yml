name: Playwright Validation

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Automation branch holding the generated specs
        required: true
        type: string
      commit_sha:
        description: Exact automation commit to check out (tests)
        required: true
        type: string
      source_repo:
        description: Frontend repository, as owner/repo (the app under test)
        required: true
        type: string
      source_commit:
        description: Exact frontend commit the tests were generated from
        required: true
        type: string
      backend_repo:
        description: Backend repository as owner/repo. Empty means use the BACKEND_URL secret instead of starting one.
        required: false
        default: ""
        type: string
      backend_ref:
        description: Backend branch or commit to run. Defaults to its default branch.
        required: false
        default: ""
        type: string
      frontend_install_cmd:
        description: >-
          Command to install frontend dependencies, run from the frontend checkout root.
          Empty means auto-detect an npm project (npm ci / npm install). Set this for any
          other language or package manager (pnpm, yarn, poetry, bundler, go mod, ...).
        required: false
        default: ""
        type: string
      frontend_start_cmd:
        description: >-
          Command to start the frontend dev server, run from the frontend checkout root.
          Empty defaults to `npm run dev`. Must bind to frontend_port and keep running in
          the foreground (it is backgrounded by the workflow itself).
        required: false
        default: ""
        type: string
      frontend_port:
        description: Port the frontend serves on.
        required: false
        default: "3000"
        type: string
      backend_install_cmd:
        description: >-
          Command to install backend dependencies, run from the backend checkout root.
          Empty means auto-detect a Python project (pip install -r requirements.txt or
          pip install .). Set this for any other language (npm/yarn, bundler, go mod,
          maven/gradle, dotnet restore, ...).
        required: false
        default: ""
        type: string
      backend_start_cmd:
        description: >-
          Command to start the backend server, run from the backend checkout root. Empty
          means auto-detect a Python ASGI app and run it with uvicorn. Must bind to
          backend_port and keep running in the foreground.
        required: false
        default: ""
        type: string
      backend_port:
        description: Port the backend serves on.
        required: false
        default: "8000"
        type: string
      grep:
        description: >-
          Playwright --grep regex. Empty runs the whole suite (every initial
          validation run). Non-empty scopes this run to only the matching
          tests -- used by the agent's repair loop so rechecking whether a
          fix landed costs that test's own time, not a full re-run of every
          already-passing test in the suite.
        required: false
        default: ""
        type: string

concurrency:
  group: playwright-validation-${{ inputs.branch }}
  cancel-in-progress: true

env:
  FRONTEND_PORT: ${{ inputs.frontend_port || '3000' }}
  FRONTEND_URL: ${{ secrets.FRONTEND_URL || format('http://localhost:{0}', inputs.frontend_port || '3000') }}
  BACKEND_URL: ${{ secrets.BACKEND_URL || format('http://localhost:{0}', inputs.backend_port || '8000') }}
  BACKEND_PORT: ${{ inputs.backend_port || '8000' }}
  # `if:` conditionals cannot reference the `secrets` context directly (GitHub
  # rejects the workflow at dispatch time with "Unrecognized named-value:
  # 'secrets'"), so the presence check is done once here, in `env:`, where
  # `secrets` is allowed, and steps gate on this plain env flag instead.
  FRONTEND_DEPLOYED: ${{ secrets.FRONTEND_URL != '' }}

# Three jobs, each its own runner: PREPARE (checkout + install once) ->
# VALIDATE (boot the app, run the suite) -> REPORT (merge + analyse +
# publish). Splitting a stage out as its own job means it can be re-run on
# its own (GitHub's "re-run failed jobs" reuses the artifacts already
# produced by the jobs that passed) instead of always re-paying checkout +
# install + browser download just to retry reporting, and each stage gets
# its own timeout budget instead of sharing one 30-minute ceiling.
#
# What *can't* cross a job boundary as-is: a running process (the backend/
# frontend dev servers must be started in the same job that uses them,
# never in prepare) and anything installed outside this checkout (a plain
# system-wide `pip install` lands in the runner's Python install, not in
# `backend/`, so it would vanish at the job boundary -- backend deps are
# installed into a workspace-relative `backend/.venv` instead, specifically
# so the whole thing survives being tarred into the prepared artifact).
# Playwright's OS-level apt dependencies (`--with-deps`) are runner-VM
# state, not something an artifact can carry either -- the browser
# *binary* is prepared once and handed off, but `playwright install-deps`
# still runs again in validate, cheaply, against whatever binary the
# prepared workspace already has.
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      slug: ${{ steps.slug.outputs.slug }}

    steps:
      - name: Name this run's artifacts
        id: slug
        env:
          BRANCH: ${{ inputs.branch }}
        run: echo "slug=${BRANCH//\//-}" >> "$GITHUB_OUTPUT"

      - name: Checkout generated tests (this repo, exact commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          path: automation

      - name: Checkout application under test (frontend, exact commit)
        if: env.FRONTEND_DEPLOYED != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_commit }}
          path: frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN || github.token }}

      - name: Checkout backend
        if: inputs.backend_repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.backend_repo }}
          ref: ${{ inputs.backend_ref || '' }}
          path: backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || secrets.FRONTEND_REPO_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            automation/package-lock.json

      - name: Install frontend dependencies
        if: env.FRONTEND_DEPLOYED != 'true'
        working-directory: frontend
        run: |
          if [ -n "${{ inputs.frontend_install_cmd }}" ]; then
            bash -c "${{ inputs.frontend_install_cmd }}"
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Setup Python for backend
        if: inputs.backend_repo != '' && inputs.backend_install_cmd == ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        if: inputs.backend_repo != ''
        working-directory: backend
        run: |
          # Into a venv INSIDE this checkout, not the runner's system Python --
          # a plain `pip install` would land outside `backend/` and be lost
          # the moment this job ends, since only this directory gets tarred
          # into the prepared artifact for the validate job to restore.
          python -m venv .venv
          source .venv/bin/activate
          if [ -n "${{ inputs.backend_install_cmd }}" ]; then
            bash -c "${{ inputs.backend_install_cmd }}"
          elif [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install --upgrade pip
            pip install .
          else
            echo "::error title=No install command::backend_install_cmd was not provided" \
              "and neither requirements.txt nor pyproject.toml was found -- a non-Python" \
              "backend must be given an explicit backend_install_cmd"
            exit 1
          fi

      - name: Install test dependencies
        working-directory: automation
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm install --no-save @playwright/test allure-playwright

      - name: Install Playwright browser binaries
        working-directory: automation
        run: npx playwright install chromium
        # Binary only, no --with-deps here: the OS-level apt packages this
        # browser needs are runner-VM state and can't travel in an
        # artifact, so validate installs those itself against this same
        # binary via `playwright install-deps`.

      - name: Package the prepared workspace
        run: |
          tar -czf prepared-workspace.tar.gz \
            $(test -d frontend && echo frontend) \
            $(test -d backend && echo backend) \
            automation
          tar -czf prepared-playwright-cache.tar.gz -C "$HOME" .cache/ms-playwright

      - name: Upload prepared workspace
        uses: actions/upload-artifact@v4
        with:
          name: prepared-${{ steps.slug.outputs.slug }}
          path: |
            prepared-workspace.tar.gz
            prepared-playwright-cache.tar.gz
          retention-days: 1

  validate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tests_outcome: ${{ steps.tests.outcome }}

    steps:
      - name: Download prepared workspace
        uses: actions/download-artifact@v4
        with:
          name: prepared-${{ needs.prepare.outputs.slug }}

      - name: Unpack prepared workspace
        run: |
          tar -xzf prepared-workspace.tar.gz
          mkdir -p "$HOME/.cache"
          tar -xzf prepared-playwright-cache.tar.gz -C "$HOME"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python to run the backend
        if: inputs.backend_repo != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright's OS-level browser dependencies
        working-directory: automation
        run: npx playwright install-deps chromium

      - name: Start backend
        if: inputs.backend_repo != ''
        working-directory: backend
        env:
          PORT: ${{ inputs.backend_port || '8000' }}
          CORS_ORIGINS: '["http://127.0.0.1:${{ inputs.frontend_port || ''3000'' }}","http://localhost:${{ inputs.frontend_port || ''3000'' }}"]'
        run: |
          cmd="${{ inputs.backend_start_cmd }}"
          if [ -z "$cmd" ]; then
            entry=""
            for candidate in app.main:app main:app app:app src.main:app; do
              module="${candidate%%:*}"
              path="$(echo "$module" | tr '.' '/').py"
              if [ -f "$path" ]; then entry="$candidate"; break; fi
            done
            if [ -z "$entry" ]; then
              echo "::error title=No ASGI entrypoint::backend_start_cmd was not provided and" \
                "no app/main.py, main.py, app.py or src/main.py was found -- a non-Python" \
                "backend must be given an explicit backend_start_cmd"
              exit 1
            fi
            cmd="source .venv/bin/activate && python -m uvicorn $entry --host 0.0.0.0 --port ${{ inputs.backend_port || '8000' }}"
          fi
          echo "Starting backend: $cmd"
          nohup bash -c "$cmd" > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/backend.pid"

      - name: Backend health check
        env:
          BACKEND_HEALTH_PATH: ${{ vars.BACKEND_HEALTH_PATH || '/health' }}
        run: |
          target="${BACKEND_URL%/}${BACKEND_HEALTH_PATH}"
          echo "Probing backend at $target"
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$target" || true)
            if ! [[ "$code" =~ ^[0-9]{3}$ ]]; then
              code="000"
            fi
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
              echo "Backend reachable (HTTP $code)"
              exit 0
            fi
            echo "  attempt $attempt: HTTP $code"
            sleep 2
          done
          echo "::error title=Backend unreachable::$target did not respond in 60s"
          if [ -f "$GITHUB_WORKSPACE/backend.log" ]; then
            echo "--- last 60 lines of backend log ---"
            tail -n 60 "$GITHUB_WORKSPACE/backend.log"
          fi
          exit 1

      - name: Start frontend
        if: env.FRONTEND_DEPLOYED != 'true'
        working-directory: frontend
        env:
          PORT: ${{ inputs.frontend_port || '3000' }}
          NEXT_PUBLIC_API_URL: ${{ env.BACKEND_URL }}
          VITE_API_URL: ${{ env.BACKEND_URL }}
          API_URL: ${{ env.BACKEND_URL }}
        run: |
          cmd="${{ inputs.frontend_start_cmd }}"
          if [ -z "$cmd" ]; then cmd="npm run dev"; fi
          echo "Starting frontend: $cmd"
          nohup bash -c "$cmd" > "$GITHUB_WORKSPACE/frontend-dev.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/frontend.pid"

      - name: Wait for frontend
        run: |
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$FRONTEND_URL" || true)
            if ! [[ "$code" =~ ^[0-9]{3}$ ]]; then
              code="000"
            fi
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
              echo "Frontend answering (HTTP $code) after ${attempt}s"
              curl -s -o /dev/null --max-time 60 "$FRONTEND_URL" || true
              exit 0
            fi
            sleep 2
          done
          echo "::error title=Frontend never started::no answer from $FRONTEND_URL in 120s"
          echo "--- last 100 lines of dev server log ---"
          tail -n 100 "$GITHUB_WORKSPACE/frontend-dev.log" || true
          exit 1

      - name: Check the app actually served its client bundle
        run: |
          log="$GITHUB_WORKSPACE/frontend-dev.log"
          [ -f "$log" ] || exit 0
          if grep -q "Blocked cross-origin request" "$log"; then
            echo "::error title=Client bundle blocked::The dev server refused to serve"\
              "its own JavaScript to the browser's origin, so the app never hydrated."\
              "Every interactive element would be missing and all tests would time out"\
              "waiting for elements that cannot exist. Add allowedDevOrigins to"\
              "next.config.js, or serve a production build instead of the dev server."
            grep -n "Blocked cross-origin request" "$log" | head -n 5
            exit 1
          fi
          echo "No blocked dev resources - the browser can load the app's JavaScript."

      - name: Configure test authentication
        env:
          TEST_AUTH_STORAGE_STATE: ${{ secrets.TEST_AUTH_STORAGE_STATE }}
        run: |
          if [ -z "$TEST_AUTH_STORAGE_STATE" ]; then
            echo "No TEST_AUTH_STORAGE_STATE secret configured -- app under test is treated as open."
            exit 0
          fi
          state_file="$GITHUB_WORKSPACE/auth-storage-state.json"
          printf '%s' "$TEST_AUTH_STORAGE_STATE" > "$state_file"
          if ! node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$state_file"; then
            echo "::error title=Invalid TEST_AUTH_STORAGE_STATE::secret is not valid JSON -- it" \
              "must be a Playwright storageState object (cookies + localStorage), e.g. from" \
              "'npx playwright codegen --save-storage=auth.json' after logging in once, or" \
              "context.storageState() in a setup script. Paste that file's content as the secret."
            exit 1
          fi
          echo "PLAYWRIGHT_STORAGE_STATE=$state_file" >> "$GITHUB_ENV"
          echo "Authenticated session loaded from the TEST_AUTH_STORAGE_STATE secret."

      - name: Run generated Playwright tests
        id: tests
        continue-on-error: true
        working-directory: automation
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.FRONTEND_URL }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ../results/results.json
          CI: "true"
          TEST_GREP: ${{ inputs.grep }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          mkdir -p ../results
          # max-failures is a safety cap against a truly systemic problem (app down,
          # session expired, wrong baseURL -- anything that fails EVERY test the same
          # way) burning the full test count on 60s-per-test timeouts until the job's
          # overall timeout-minutes kills the whole run with zero results.json ever
          # written. It is deliberately high (100) now -- independent, unrelated
          # failures should all get to run; the agent's own shard-until-complete loop
          # (src/agent/agent.py, MAX_COMPLETION_ROUNDS) is what schedules follow-up runs
          # for anything this cap still leaves not-executed, not this flag itself.
          args=(--reporter=line,json,allure-playwright --output=../results/artifacts --max-failures=100)
          if [ -n "$TEST_GREP" ]; then
            args+=(--grep "$TEST_GREP")
          fi
          npx playwright test "${args[@]}"

      - name: Collect results
        run: |
          json=results/results.json
          if [ ! -f "$json" ]; then
            echo "::error title=No results::Playwright produced no JSON report"
            exit 0
          fi
          node -e '
            const r = require("./results/results.json");
            let passed = 0, failed = 0, skipped = 0, flaky = 0;
            const walk = (suites = []) => {
              for (const s of suites) {
                for (const spec of s.specs || []) {
                  for (const t of spec.tests || []) {
                    const st = t.status || t.results?.[0]?.status;
                    if (t.status === "flaky") flaky++;
                    else if (st === "expected" || st === "passed") passed++;
                    else if (st === "skipped") skipped++;
                    else failed++;
                  }
                }
                walk(s.suites);
              }
            };
            walk(r.suites);
            const total = passed + failed + skipped + flaky;
            const out = { total, passed, failed, skipped, flaky };
            console.log(JSON.stringify(out));
            require("fs").writeFileSync("results/summary.json", JSON.stringify(out, null, 2));
          ' | tee results/summary-line.txt

      - name: Stop servers
        if: always()
        run: |
          for pidfile in frontend.pid backend.pid; do
            if [ -f "$GITHUB_WORKSPACE/$pidfile" ]; then
              kill "$(cat "$GITHUB_WORKSPACE/$pidfile")" 2>/dev/null || true
            fi
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ needs.prepare.outputs.slug }}
          path: |
            results/
            frontend-dev.log
            backend.log
            automation/allure-results
          retention-days: 1

  report:
    needs: [prepare, validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # needed to push this run's Allure report to gh-pages

    steps:
      - name: Checkout validation script (this repo, exact commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          path: automation

      - name: Download test results
        uses: actions/download-artifact@v4
        continue-on-error: true # nothing to download if validate crashed before uploading
        with:
          name: results-${{ needs.prepare.outputs.slug }}

      - name: Setup Node
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d automation/allure-results ]; then
            npx --yes allure-commandline generate automation/allure-results \
              --clean -o results/allure-report
          else
            echo "No allure-results directory - skipping report generation."
          fi

      # Both the per-run report and the landing page are staged into ONE local
      # tree and published with a SINGLE peaceiris push below. Two separate
      # pushes (the old design) meant two separate triggers of GitHub's own
      # internal "pages build and deployment" system in quick succession --
      # that system serializes builds per repo (only one running + one queued;
      # GitHub's Actions logs for one real run showed BOTH git pushes succeed
      # while GitHub silently never started a build for either one, with no
      # error anywhere in the job -- a rate/contention drop entirely outside
      # this workflow's visibility or control). One push halves the trigger
      # rate and removes the self-inflicted race between our own two steps.
      #
      # Published under its own <branch>/<run_id> path so a link to THIS run's
      # report keeps pointing at THIS run's report forever -- a later run
      # never overwrites it, unlike publishing every run to the same path.
      - name: Stage Pages content (report + landing page)
        if: always() && hashFiles('results/allure-report/index.html') != ''
        run: |
          mkdir -p "pages-publish/${{ inputs.branch }}/${{ github.run_id }}"
          cp -r results/allure-report/. "pages-publish/${{ inputs.branch }}/${{ github.run_id }}/"
          cat > pages-publish/index.html <<HTML
          <!doctype html>
          <html><head><meta charset="utf-8"><title>Playwright validation reports</title></head>
          <body>
            <h1>Playwright validation reports</h1>
            <p>Most recent: <a href="${{ inputs.branch }}/${{ github.run_id }}/">${{ inputs.branch }} (run ${{ github.run_id }})</a></p>
            <p>Every branch's reports live under <code>&lt;branch&gt;/&lt;run_id&gt;/</code> on this same site.</p>
          </body></html>
          HTML

      - name: Publish Pages content
        if: always() && hashFiles('results/allure-report/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages-publish
          publish_branch: gh-pages
          keep_files: true

      - name: Setup Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analyse results and route
        if: always()
        env:
          VALIDATION_BRANCH: ${{ inputs.branch }}
          VALIDATION_COMMIT_SHA: ${{ inputs.commit_sha }}
          VALIDATION_SOURCE_REPO: ${{ inputs.source_repo }}
          VALIDATION_SOURCE_COMMIT: ${{ inputs.source_commit }}
          VALIDATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python automation/scripts/validation_report.py \
            --results results/results.json \
            --out results/validation-report.json

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ needs.prepare.outputs.slug }}
          path: |
            results/
            frontend-dev.log
            backend.log
            automation/allure-results
          retention-days: 14

      - name: Report suite outcome
        if: always()
        run: |
          echo "### Playwright validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- branch: \`${{ inputs.branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- app commit: \`${{ inputs.source_commit }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/summary-line.txt ]; then
            echo "- results: \`$(cat results/summary-line.txt)\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- suite: ${{ needs.validate.outputs.tests_outcome }}" >> "$GITHUB_STEP_SUMMARY"
